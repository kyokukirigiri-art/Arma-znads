<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAPA DA CIDADE // AURELIA × AVANTARYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<script src="tema.js"></script>
<style>
/* ============================================================
   MAPA DA CIDADE — paleta oficial ARMA-ZENADS
   roxo neon + ciano + amarelo, fundo roxo-escuro
   ============================================================ */
:root{
  --bg:#07040a;
  --panel:#120718;
  --panel2:#1a0a24;
  --line:#2e133d;
  --yellow:#ffe62a;
  --yellow-glow:rgba(255,230,42,.45);
  --cyan:#22e6d2;
  --cyan-dim:rgba(34,230,210,.30);
  --cyan-glow:rgba(34,230,210,.45);
  --purple:#8b5bff;
  --purple-dim:rgba(139,91,255,.30);
  --purple-glow:rgba(139,91,255,.45);
  --magenta:#ff2ea6;
  --magenta-glow:rgba(255,46,166,.45);
  --green:#46ff7a;
  --orange:#ff9a3d;
  --txt:#e3dbe6;
  --dim:#816f8a;
  --mono:'Share Tech Mono','Courier New',monospace;
  --hud:'Chakra Petch','Share Tech Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--txt);font-family:var(--mono);
  overflow:hidden;
  background-image:
    radial-gradient(1200px 500px at 50% -10%, rgba(var(--glow-rgb),.10), transparent 60%),
    radial-gradient(900px 600px at 100% 100%, rgba(34,230,210,.05), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(255,46,166,.05), transparent 60%);
}
::selection{background:var(--yellow);color:#07040a;}

/* ================= FUNDO GRID ================= */
.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(139,91,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(139,91,255,.07) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse at center,black 40%,transparent 90%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 40%,transparent 90%);
}

.scanbar{
  position:fixed;left:0;right:0;height:90px;top:-100px;pointer-events:none;z-index:40;
  background:linear-gradient(transparent,rgba(139,91,255,.10),transparent);
  animation:scan 6s linear infinite;
}
@keyframes scan{to{top:110vh;}}

/* ============ TRANSIÇÃO GLITCH ============ */
#glitch-overlay{
  position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;
  background:
    repeating-linear-gradient(0deg,rgba(139,91,255,.16) 0 3px,transparent 3px 7px),
    repeating-linear-gradient(90deg,rgba(34,230,210,.10) 0 2px,transparent 2px 9px);
}
body.glitching #glitch-overlay{animation:glitch .9s steps(12) both;}
@keyframes glitch{
  0%{opacity:0;} 10%{opacity:1;transform:translateX(-8px);}
  25%{opacity:.6;transform:translateX(6px) skewX(3deg);}
  40%{opacity:1;transform:translateX(-4px);}
  55%{opacity:.4;transform:translateX(10px);}
  70%{opacity:.9;transform:translateX(-2px) skewX(-2deg);}
  85%{opacity:.5;transform:translateX(4px);}
  100%{opacity:0;transform:none;}
}
body.glitching .map-stage{animation:shake .9s steps(10);}
@keyframes shake{
  0%,100%{transform:none;}
  20%{transform:translate(6px,-3px);}
  40%{transform:translate(-5px,4px);}
  60%{transform:translate(4px,2px);}
  80%{transform:translate(-3px,-4px);}
}

/* ================= HUD TOPO ================= */
.hud-top{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;
  background:linear-gradient(rgba(7,4,10,.9),rgba(7,4,10,.55) 75%,transparent);
  font-size:.66rem;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;
}
.hud-top .brand{color:var(--purple);font-family:var(--hud);font-weight:700;}
.hud-top .sig{display:flex;gap:5px;align-items:center;}
.hud-top .sig i{display:block;width:16px;height:5px;background:var(--cyan);box-shadow:0 0 8px var(--cyan-glow);animation:sigBlink 2.4s infinite;}
.hud-top .sig i:nth-child(2){animation-delay:.4s;}
.hud-top .sig i:nth-child(3){animation-delay:.8s;}
@keyframes sigBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
#coords{color:var(--cyan);min-width:170px;text-align:right;}
.hud-top .cfg-link{color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:4px 10px;margin-left:12px;letter-spacing:.2em;transition:.15s;pointer-events:auto;}
.hud-top .cfg-link:hover{color:#07040a;background:var(--yellow);border-color:var(--yellow);}

/* ================= PALCO DO MAPA ================= */
.map-stage{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  padding:52px 12px 12px;
}
.map-wrap{
  position:relative;
  width:min(96vw,1100px);
  aspect-ratio:1000/640;
  max-height:calc(100vh - 76px);
}
.map-wrap svg{width:100%;height:100%;display:block;overflow:visible;}

/* moldura do mapa */
.map-frame{
  position:absolute;inset:-10px;pointer-events:none;
  clip-path:polygon(24px 0,calc(100% - 24px) 0,100% 24px,100% calc(100% - 24px),calc(100% - 24px) 100%,24px 100%,0 calc(100% - 24px),0 24px);
  box-shadow:inset 0 0 0 1.5px var(--purple);
  opacity:.7;
}
.map-frame::before,.map-frame::after{
  content:'';position:absolute;width:22px;height:22px;
  border:2px solid var(--cyan);filter:drop-shadow(0 0 6px var(--cyan-glow));
}
.map-frame::before{top:0;left:0;border-right:none;border-bottom:none;}
.map-frame::after{bottom:0;right:0;border-left:none;border-top:none;}

/* ---- SVG ---- */
.district{
  fill:rgba(139,91,255,.04);
  stroke-width:2;cursor:pointer;
  transition:fill-opacity .25s ease, stroke-width .25s ease, filter .25s ease;
}
.district:hover{fill-opacity:.16;stroke-width:3;filter:drop-shadow(0 0 8px currentColor);}
.street{stroke:rgba(139,91,255,.16);stroke-width:1.4;}
.street.major{stroke:rgba(34,230,210,.22);stroke-width:2.2;}
.bridge{fill:none;stroke:var(--purple);stroke-width:3;stroke-dasharray:10 6;opacity:.55;animation:bridgeFlow 20s linear infinite;}
@keyframes bridgeFlow{to{stroke-dashoffset:-640;}}
.wall{stroke:rgba(255,230,42,.28);stroke-width:2;}
.wall-hatch{stroke:rgba(255,230,42,.16);stroke-width:1.2;}

.zone-label{font-family:var(--hud);font-weight:700;letter-spacing:.4em;text-anchor:middle;paint-order:stroke;stroke:#07040a;stroke-width:8;}
.zone-name{font-size:44px;}
.zone-sub{font-size:15px;letter-spacing:.55em;fill:var(--dim);stroke-width:6;}
.dist-label{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-anchor:middle;paint-order:stroke;stroke:#07040a;stroke-width:5;opacity:.85;}
.n-label{font-family:var(--hud);font-weight:700;font-size:20px;fill:var(--cyan);}
.deco{opacity:.5;}

/* ============ PINS: marcador pequeno com ícone ============ */
.map-stage{padding:52px 12px 40px 244px;}
.map-wrap{width:min(calc(100vw - 268px),1100px);max-height:calc(100vh - 100px);}
.pin{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:38px;height:38px;border:none;background:none;cursor:pointer;z-index:20;}
.pin .ico{position:absolute;inset:6px;display:grid;place-items:center;font-size:.95rem;line-height:1;
  background:rgba(10,5,14,.92);border:1px solid var(--pc);color:var(--pc);
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  box-shadow:0 0 12px var(--pcg);transition:transform .15s,background .15s;}
.pin .wave{position:absolute;left:50%;top:50%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid var(--pc);animation:wave 2.4s ease-out infinite;}
@keyframes wave{0%{width:24px;height:24px;opacity:.8;}100%{width:50px;height:50px;opacity:0;}}
.pin .tag{position:absolute;left:50%;bottom:calc(100% - 2px);transform:translate(-50%,4px);white-space:nowrap;opacity:0;pointer-events:none;
  background:rgba(10,5,14,.95);border:1px solid var(--pc);padding:3px 10px;font-family:var(--hud);font-weight:700;font-size:.66rem;letter-spacing:.16em;color:var(--pc);text-transform:uppercase;transition:.15s;}
.pin:hover .tag,.pin.hl .tag{opacity:1;transform:translate(-50%,0);}
.pin:hover .ico,.pin.hl .ico{transform:scale(1.3);background:var(--pc);color:#07040a;}
.pin:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;}
.pin.boss .ico{animation:bossPulse 1.4s ease-in-out infinite;}
@keyframes bossPulse{0%,100%{box-shadow:0 0 8px var(--pcg);}50%{box-shadow:0 0 22px var(--pc);}}
.c-cyan{--pc:var(--cyan);--pcg:var(--cyan-glow);} .c-yellow{--pc:var(--yellow);--pcg:var(--yellow-glow);}
.c-red{--pc:var(--red);--pcg:rgba(var(--p-rgb),.45);} .c-green{--pc:var(--green);--pcg:rgba(70,255,122,.45);}
.c-purple{--pc:var(--purple);--pcg:var(--purple-glow);} .c-orange{--pc:var(--orange);--pcg:rgba(255,154,61,.45);}

/* ============ BARRA DE ATALHOS (estilo filtro) ============ */
.side{position:fixed;left:12px;top:56px;bottom:40px;width:216px;z-index:55;display:flex;flex-direction:column;
  background:linear-gradient(rgba(18,7,24,.92),rgba(7,4,10,.88));border:1px solid var(--line);border-left:3px solid var(--red);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);}
.side h2{font-family:var(--hud);font-size:.7rem;letter-spacing:.3em;color:var(--red);padding:12px 14px 10px;border-bottom:1px solid var(--line);}
.side-list{flex:1;overflow:auto;padding:6px 0;}
.it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;background:none;border:none;border-left:2px solid transparent;
  color:var(--txt);font-family:var(--hud);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;text-align:left;cursor:pointer;transition:.12s;}
.it .ii{flex:none;width:28px;height:28px;display:grid;place-items:center;font-size:.95rem;border:1px solid var(--pc);color:var(--pc);background:rgba(255,255,255,.03);}
.it small{display:block;font-family:var(--mono);font-size:.54rem;letter-spacing:.12em;color:var(--dim);margin-top:2px;}
.it:hover,.it.hl{background:rgba(255,255,255,.05);border-left-color:var(--pc);color:var(--pc);}
.it:hover .ii,.it.hl .ii{background:var(--pc);color:#07040a;}
.side-leg{padding:10px 14px;border-top:1px solid var(--line);font-size:.55rem;letter-spacing:.14em;color:var(--dim);line-height:1.9;text-transform:uppercase;}
.side-leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--lc);box-shadow:0 0 6px var(--lc);}

.hud-bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 18px 10px;text-align:right;
  background:linear-gradient(transparent,rgba(7,4,10,.92) 40%);font-size:.6rem;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;pointer-events:none;}
.hint{color:var(--yellow);animation:hintBlink 1.8s ease-in-out infinite;}
@keyframes hintBlink{0%,100%{opacity:.35;}50%{opacity:1;}}

/* ============ CELULAR: atalhos viram dock inferior ============ */
@media (max-width:760px){
  .map-stage{padding:48px 6px 92px;align-items:flex-start;}
  .map-wrap{width:100%;max-height:none;margin-top:16px;}
  .side{left:0;right:0;top:auto;bottom:0;width:auto;border:none;border-top:2px solid var(--red);clip-path:none;background:rgba(7,4,10,.96);}
  .side h2,.side-leg,.it small{display:none;}
  .side-list{display:flex;padding:0;overflow-x:auto;}
  .it{flex:1 0 64px;flex-direction:column;gap:3px;padding:8px 4px 10px;border-left:none;border-top:2px solid transparent;font-size:.54rem;letter-spacing:.06em;text-align:center;justify-content:center;}
  .it:hover,.it.hl{border-left-color:transparent;border-top-color:var(--pc);}
  .hud-bottom{display:none;} #coords{display:none;} .hud-top{font-size:.55rem;}
  .zone-name{font-size:34px;} .pin{width:34px;height:34px;} .pin .ico{font-size:.8rem;}
}
/* ---- camada HUD / cidade procedural ---- */
#gBld *,#gGrid *,#gLand *,#gWater *,#gRoad *,#gHud *,#gLab *,#xh *{pointer-events:none;}
#gDist .district{pointer-events:all;}
.lo{fill:var(--z);fill-opacity:.11;stroke:var(--z);stroke-opacity:.55;stroke-width:.5;}
.hb{fill:var(--z);fill-opacity:.07;stroke:var(--z);stroke-opacity:.35;stroke-width:.4;}
.hr{fill:var(--z);fill-opacity:.34;stroke:var(--z);stroke-opacity:.9;stroke-width:.5;}
.rd{fill:none;stroke:var(--z);stroke-opacity:.2;stroke-width:.6;}
.av{fill:none;stroke:#22e6d2;stroke-opacity:.38;stroke-width:1.5;stroke-linecap:round;}
.land{fill:rgba(139,91,255,.035);stroke:#8b5bff;stroke-opacity:.45;stroke-width:1.5;}
.cn1{fill:none;stroke:#22e6d2;stroke-opacity:.5;stroke-linejoin:round;stroke-linecap:round;}
.cn2{fill:none;stroke:#06101c;stroke-linejoin:round;stroke-linecap:round;}
.cn3{fill:none;stroke:#22e6d2;stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 9;animation:bridgeFlow 14s linear infinite;}
.bcase{stroke:#07040a;stroke-width:8;} .bdeck{stroke:#8b5bff;stroke-width:4.5;} .brail{stroke:#22e6d2;stroke-width:.8;stroke-opacity:.8;}
.gl{stroke:rgba(139,91,255,.05);stroke-width:.5;} .gM{stroke:rgba(139,91,255,.11);stroke-width:.6;}
.gx{stroke:#22e6d2;stroke-opacity:.35;stroke-width:.8;}
.rk{stroke:#8b5bff;stroke-opacity:.6;stroke-width:.7;}
.tx{font-family:var(--mono);font-size:6.5px;letter-spacing:.12em;fill:var(--dim);}
.tx.c{fill:#22e6d2;fill-opacity:.8;} .tx.y{fill:#ffe62a;fill-opacity:.8;}
.sub{font-family:var(--mono);font-size:6.5px;letter-spacing:.2em;text-anchor:middle;fill:var(--dim);paint-order:stroke;stroke:#07040a;stroke-width:3;}
.wp{fill:none;stroke:#ffe62a;stroke-opacity:.75;stroke-width:.8;}
.plz{fill:none;stroke:#22e6d2;stroke-opacity:.45;stroke-width:.8;stroke-dasharray:2 3;}
#xh line{stroke:#ffe62a;stroke-opacity:.35;stroke-width:.6;stroke-dasharray:3 4;}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanbar"></div>
<div id="glitch-overlay"></div>

<!-- ======= HUD TOPO ======= -->
<div class="hud-top">
  <span class="brand">⬡ SYS.BOOT // CITY_MAP_v11</span>
  <span class="sig"><i></i><i></i><i></i> CONEXÃO SEGURA</span>
  <span id="coords">LAT --.-- / LON --.--</span>
  <a class="cfg-link" href="configuracoes.html" aria-label="Configurações">⚙ CONFIG</a>
</div>

<!-- ======= MAPA ======= -->
<div class="map-stage">
  <div class="map-wrap" id="mapWrap">
    <div class="map-frame"></div>

    <svg viewBox="0 0 1000 640" aria-label="Mapa da cidade — Cidade Alta Aurelia e Cidade Baixa Avantarys">
      <defs>
        <filter id="glowC" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="gGrid"></g><g id="gLand"></g><g id="gWater"></g><g id="gBld"></g><g id="gRoad"></g>
      <g id="gDist" filter="url(#glowC)"></g><g id="gLab"></g><g id="gHud"></g>
      <g id="xh" opacity="0"><line id="xhv" y1="20" y2="620"/><line id="xhh" x1="22" x2="978"/></g>
    </svg>

    <div id="pins"></div>
  </div>
</div>

<!-- ======= BARRA DE ATALHOS ======= -->
<aside class="side" aria-label="Atalhos das áreas">
  <h2>◢ ÁREAS</h2>
  <div class="side-list" id="sideList"></div>
  <div class="side-leg">
    <span><i style="--lc:var(--cyan)"></i>Aurelia — alta</span><br>
    <span><i style="--lc:var(--red)"></i>Avantarys — baixa</span><br>
    <span><i style="--lc:var(--green)"></i>Zona hostil</span>
  </div>
</aside>

<div class="hud-bottom"><span class="hint">▸ CLIQUE EM UM ÍCONE OU ATALHO ◂</span></div>

<script>
// áreas: um só lugar alimenta o mapa e a barra de atalhos
var AREAS=[
 {n:'Regras',   i:'📜',c:'cyan',  x:21,y:26,h:'regras_do_setor_7.html',s:'Informativo'},
 {n:'Missões',  i:'🎯',c:'yellow',x:78,y:24,h:'missoes.html',          s:'Aposta'},
 {n:'Loja',     i:'🛒',c:'red',   x:19,y:72,h:'loja.html',             s:'Compra'},
 {n:'Venda',    i:'🎲',c:'purple',x:80,y:74,h:'venda.html',            s:'Mercador'},
 {n:'Esconderijo',i:'🏚️',c:'orange',x:31,y:86,h:'base_de_comando.html', s:'Seu QG'},
 {n:'Hacker_Area',i:'⚔️',c:'green',x:49,y:88,h:'batalha.html',boss:1,   s:'Boss & Rua'}
];
var pins=document.getElementById('pins'), side=document.getElementById('sideList');
AREAS.forEach(function(a,k){
  var p=document.createElement('button'); p.className='pin c-'+a.c+(a.boss?' boss':''); p.dataset.k=k;
  p.style.cssText='--x:'+a.x+'%;--y:'+a.y+'%'; p.setAttribute('aria-label','Abrir '+a.n);
  p.innerHTML='<span class="wave"></span><span class="ico">'+a.i+'</span><span class="tag">'+a.n+'</span>';
  pins.appendChild(p);
  var it=document.createElement('button'); it.className='it c-'+a.c; it.dataset.k=k;
  it.innerHTML='<span class="ii">'+a.i+'</span><span>'+a.n+'<small>'+a.s+'</small></span>';
  side.appendChild(it);
});
function go(k){
  if(document.body.classList.contains('glitching')) return;
  document.body.classList.add('glitching');
  setTimeout(function(){ window.location.href=AREAS[k].h; },450);
}
function hl(e,on){
  var t=e.target.closest&&e.target.closest('[data-k]'); if(!t) return;
  document.querySelectorAll('[data-k="'+t.dataset.k+'"]').forEach(function(x){ x.classList.toggle('hl',on); });
}
[pins,side].forEach(function(box){
  box.addEventListener('click',function(e){ var t=e.target.closest('[data-k]'); if(t) go(+t.dataset.k); });
  box.addEventListener('mouseover',function(e){ hl(e,true); });
  box.addEventListener('mouseout',function(e){ hl(e,false); });
});

// coordenadas do "sonar"
var coords = document.getElementById('coords');
var wrap = document.getElementById('mapWrap');
wrap.addEventListener('mousemove', function(e){
  var r = wrap.getBoundingClientRect();
  var lon = ((e.clientX - r.left) / r.width * 100).toFixed(2);
  var lat = ((e.clientY - r.top) / r.height * 100).toFixed(2);
  coords.textContent = 'LAT ' + lat + ' / LON ' + lon;
});
wrap.addEventListener('mouseleave', function(){
  coords.textContent = 'LAT --.-- / LON --.--';
});
</script>
<script>
/* ===== CIDADE PROCEDURAL (mesma semente = mesma cidade). Ajuste: SEED, ZONAS, CANAIS, AVENIDAS, PONTES ===== */
(function(){
var SEED=77,R=SEED;
function rn(){R|=0;R=R+0x6D2B79F5|0;var t=Math.imul(R^R>>>15,1|R);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function ra(a,b){return a+rn()*(b-a);}
function pip(p,x,y){var c=0;for(var i=0,j=p.length-1;i<p.length;j=i++){var a=p[i],b=p[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function cr(P,n){var o=[];for(var i=0;i<P.length-1;i++){var a=P[Math.max(i-1,0)],b=P[i],c=P[i+1],d=P[Math.min(i+2,P.length-1)];
 for(var j=0;j<n;j++){var t=j/n,t2=t*t,t3=t2*t;o.push([0,1].map(function(k){return .5*(2*b[k]+(c[k]-a[k])*t+(2*a[k]-5*b[k]+4*c[k]-d[k])*t2+(3*b[k]-a[k]-3*c[k]+d[k])*t3);}));}}
 o.push(P[P.length-1]);return o;}
function dS(x,y,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/l)):0;return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy);}
function f(n){return Math.round(n*10)/10;}
function pd(p){return p.map(function(q,i){return(i?'L':'M')+f(q[0])+' '+f(q[1]);}).join('')+'Z';}

function zona(z){

 function W(u,v){return[cx+u*co-v*si,cy+u*si+v*co];}
 var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 P.forEach(function(q){var dx=q[0]-cx,dy=q[1]-cy,u=dx*co+dy*si,v=-dx*si+dy*co;x0=Math.min(x0,u);x1=Math.max(x1,u);y0=Math.min(y0,v);y1=Math.max(y1,v);});
 var lo='',hb='',hr='',rd='',B=z.b,E=z.e,h=z.st/2;
 for(var v=y0-ra(0,B[2]);v<y1;){var bh=ra(B[2],B[3]);
  for(var u=x0-ra(0,B[0]);u<x1;){var bw=ra(B[0],B[1]),c=W(u+bw/2,v+bh/2);
   if(pip(P,c[0],c[1])){
    var nu=Math.max(1,Math.round((bw-z.st)/ra(E[0],E[1]))),nv=Math.max(1,Math.round((bh-z.st)/ra(E[0],E[1]))),n=0,cu=u+h;
    for(var a=0;a<nu;a++){var w=(bw-z.st)/nu*ra(.8,1.2);if(a==nu-1)w=u+bw-h-cu;if(w<4)break;var cv=v+h;
     for(var b=0;b<nv;b++){var q=(bh-z.st)/nv*ra(.8,1.2);if(b==nv-1)q=v+bh-h-cv;if(q<4)break;
      var g=1.1,r=[W(cu+g,cv+g),W(cu+w-g,cv+g),W(cu+w-g,cv+q-g),W(cu+g,cv+q-g)];
      if(rn()>=z.k&&r.every(function(m){return pip(P,m[0],m[1])&&livre(m[0],m[1]);})){
       n++;if(rn()<z.t){var hgt=ra(1.5,4.5);hb+=pd(r);hr+=pd(r.map(function(m){return[m[0]-hgt*.5,m[1]-hgt];}));}else lo+=pd(r);}
      cv+=q;}cu+=w;}
    if(n>1)rd+=pd([W(u,v),W(u+bw,v),W(u+bw,v+bh),W(u,v+bh)]);}
   u+=bw;}
  v+=bh;}
 return '<g style="--z:'+z.c+'"><path class="rd" d="'+rd+'"/><path class="lo" d="'+lo+'"/><path class="hb" d="'+hb+'"/><path class="hr" d="'+hr+'"/></g>';}
